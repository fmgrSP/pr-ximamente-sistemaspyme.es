<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistemas Pyme - Próximamente</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a; /* Slate 900 */
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }

    .container {
      max-width: 600px;
      animation: fadeIn 1s ease-out;
    }

    .logo {
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      height: auto;
      max-height: 80px;
      max-width: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 18px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 118, 110, 0.15);
      border: 1px solid rgba(15, 118, 110, 0.3);
      color: #5eead4;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #2dd4bf;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.7);
      animation: pulse-animation 2s infinite;
    }

    @keyframes pulse-animation {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(45, 212, 191, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      p { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="Sistemas Pyme" class="logo-img" onerror="this.onerror=null; this.src='https://placehold.co/400x120/0f172a/ffffff?text=Sistemas+Pyme';">
    </div>
    
    <h1>Preparando el lanzamiento</h1>
    
    <p>Estamos configurando la infraestructura para ofrecerte las mejores soluciones de automatización. El servicio estará disponible en breve.</p>
    
    <div class="status-badge">
      <div class="pulse"></div>
      En construcción
    </div>
  </div>

</body>
</html>
